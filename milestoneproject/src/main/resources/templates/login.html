<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/defaultTemplate">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">POWER Login</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: green;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 2rem;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 2.5rem 2rem 2rem 2rem;
            font-size: 1.5rem;
            border-radius: 0;
            box-shadow: none;
            background-color: #fff;
            text-align: center;
        }

        .card-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem; 
            margin-top: 1rem;    
        }

        .card-logo img {
            max-width: 120px; 
            height: auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .form-control {
            font-size: 1.1rem;
            padding: 0.8rem;
        }

        .btn-primary, .btn-outline-secondary {
            font-size: 1.2rem;
            padding: 0.8rem;
        }

        .text-danger {
            font-size: 1rem;
        }

        .register-btn {
            margin-top: 1rem;
        }

        .text-success {
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="login-page">

        <div class="card">

            <!-- Logo inside card -->
            <div class="card-logo">
                <img th:src="@{/images/logo.png}" alt="POWER Logo"/>
            </div>

            <!-- Page title -->
            <h1 th:text="${title}">Login</h1>

            <!-- Spring Security Login Form -->
            <form th:action="@{/login/process}" method="post" class="d-grid gap-3 text-start">

                <!-- Username -->
                <div>
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" name="username" class="form-control" id="username" required />
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" name="password" class="form-control" id="password" required />
                </div>

                <!-- Spring Security: Login Error -->
                <div th:if="${param.error}" class="text-danger mt-2">
                    Invalid username or password.
                </div>

                <!-- Spring Security: Logout Success -->
                <div th:if="${param.logout}" class="text-success mt-2">
                    You have been logged out successfully.
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <!-- Register Button -->
            <div class="text-center register-btn">
                <a th:href="@{/register}" class="btn btn-outline-secondary w-100">Register</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
